<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair with JARVIS</title><style>body{margin:0;background:#07090f;color:#dde3ed;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(92vw,440px);border:1px solid #263244;border-radius:16px;padding:24px;background:#0b1019}h2{margin-top:0;color:#75e063}button,input{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:9px;border:1px solid #34445b;background:#111a27;color:#fff}button{background:#18361f;border-color:#75e063;font-weight:700}.muted{color:#8490a3;font-size:13px}.ok{color:#75e063}.bad{color:#ff7777}#cmd{display:none}</style></head>
<body><div class="box"><h2>JARVIS DEVICE PAIRING</h2><p id="status" class="muted">Preparing secure device identity…</p><button id="pair" disabled>PAIR THIS DEVICE</button><button id="native" style="display:none">OPEN JARVIS COMPANION</button><div id="cmd"><input id="text" placeholder="Command JARVIS…"><button id="send">SEND COMMAND</button></div><p class="muted">Pairing creates a persistent cryptographic device identity in this browser. Clearing site data removes this device's private key.</p></div>
<script>
const qs=new URLSearchParams(location.search), code=(qs.get('code')||'').toUpperCase(), st=document.querySelector('#status'), btn=document.querySelector('#pair'), nativeBtn=document.querySelector('#native'), cmd=document.querySelector('#cmd'); let offer,keys,ws; nativeBtn.onclick=()=>{const u=new URL('jarvis://pair');u.searchParams.set('server',location.origin);u.searchParams.set('code',code);u.searchParams.set('server_id',qs.get('server_id')||'');u.searchParams.set('server_key',qs.get('server_key')||'');location.href=u.toString()};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function identity(){let j=localStorage.getItem('jarvis_mesh_identity'); if(j){let d=JSON.parse(j);return {device_id:d.device_id,name:d.name,public_key:d.public_key,private_key:d.private_key}} let kp=await crypto.subtle.generateKey({name:'Ed25519'},true,['sign','verify']); let pub=b64(await crypto.subtle.exportKey('raw',kp.publicKey)), priv=b64(await crypto.subtle.exportKey('pkcs8',kp.privateKey)); let d={device_id:crypto.randomUUID(),name:navigator.userAgent.includes('Android')?'Android Browser':'Browser Device',public_key:pub,private_key:priv};localStorage.setItem('jarvis_mesh_identity',JSON.stringify(d));return d}
async function sign(txt){let k=await crypto.subtle.importKey('pkcs8',unb64(keys.private_key),{name:'Ed25519'},false,['sign']);return b64(await crypto.subtle.sign('Ed25519',k,new TextEncoder().encode(txt)))}
async function connect(){let proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws/device?device_id=${encodeURIComponent(keys.device_id)}`);ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='challenge')ws.send(JSON.stringify({type:'proof',signature:await sign(m.challenge)}));if(m.type==='ready'){st.className='ok';st.textContent='Paired and connected to JARVIS.';cmd.style.display='block'}if(m.type==='capability.call'){let result={ok:false,error:'unsupported browser capability'};try{if(m.capability==='notification'){new Notification(String(m.args?.text||'JARVIS'));result={ok:true}}else if(m.capability==='vibration'){navigator.vibrate(Number(m.args?.ms||300));result={ok:true}}else if(m.capability==='clipboard.write'){await navigator.clipboard.writeText(String(m.args?.text||''));result={ok:true}}else if(m.capability==='open_url'){window.open(String(m.args?.url||''),'_blank');result={ok:true}}}catch(x){result={ok:false,error:String(x)}}ws.send(JSON.stringify({type:'capability.result',call_id:m.call_id,...result}))}};ws.onclose=()=>{st.className='bad';st.textContent='Disconnected. Reload to reconnect.'}}
(async()=>{try{keys=await identity();let known=await fetch('/api/device-known/'+encodeURIComponent(keys.device_id)).then(r=>r.json()).catch(()=>({known:false}));if(known.known){st.textContent='Known device — reconnecting securely…';btn.style.display='none';await connect();return}if(!code)throw Error('Missing pairing code. Scan a fresh QR from JARVIS.');let r=await fetch('/api/pairing/offer/'+encodeURIComponent(code));if(!r.ok)throw Error('Pairing code expired');offer=await r.json();st.textContent=`Pair with ${offer.name}? Code ${code}`;btn.disabled=false;nativeBtn.style.display='block'}catch(e){st.className='bad';st.textContent=String(e)}})();
btn.onclick=async()=>{btn.disabled=true;try{let sig=await sign(offer.nonce+':'+code);let capabilities=['jarvis.command','notification','vibration','clipboard.write','open_url'];let r=await fetch('/api/pairing/accept',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,peer:{device_id:keys.device_id,name:keys.name,public_key:keys.public_key},signature:sig,capabilities})});let j=await r.json();if(!j.ok)throw Error(j.error||'Pair failed');await connect()}catch(e){st.className='bad';st.textContent=String(e);btn.disabled=false}};
document.querySelector('#send').onclick=()=>{let t=document.querySelector('#text');if(ws?.readyState===1&&t.value.trim()){ws.send(JSON.stringify({type:'jarvis.command',text:t.value.trim()}));t.value=''}};
</script></body></html>
